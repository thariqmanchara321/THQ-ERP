name: THQ ERP CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
  pull_request:

jobs:
  flutter-checks:
    name: Flutter - ${{ matrix.project }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - apps/admin_panel
          - apps/client_app
          - apps/client_mobile
          - apps/pos_app
          - apps/mobile_pos
          - packages/erp_core
          - packages/thq_ui

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve & validate dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/ || echo "Formatting check completed with advisory warnings"

      - name: Analyze
        run: flutter analyze

      - name: Run tests when present
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No tests found for this project."
          fi

  repository-guards:
    name: Repository guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whitespace
        run: git diff --check HEAD^

      - name: Reject committed THQ backup trees
        shell: bash
        run: |
          if find . -maxdepth 1 -type d -name '.thq_*_backup_*' | grep -q .; then
            echo "ERROR: THQ backup source directory committed to repository."
            exit 1
          fi

      - name: Reject duplicate migration numbers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter

          migrations = list(Path("backend/migrations").glob("[0-9]*_*.sql"))
          numbers = [p.name.split("_", 1)[0] for p in migrations]

          known_historical = {"348", "354", "360"}
          duplicates = sorted(
              number for number, count in Counter(numbers).items()
              if count > 1 and number not in known_historical
          )

          if duplicates:
              raise SystemExit(
                  "Duplicate backend migration numbers: "
                  + ", ".join(duplicates)
              )

          print(f"Checked {len(migrations)} backend migrations.")
          PY

      - name: Guard certified Supabase fresh-install chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          required = [
              "20260907110044_thq_current_schema_baseline.sql",
              "20260907114948_thq_reference_catalog_baseline.sql",
              "20260907120240_thq_gst_master_catalog_baseline.sql",
              "20260907125625_v600_transaction_correctness_hotfix.sql",
              "20260907161022_v600_fresh_install_bootstrap_completion.sql",
          ]

          real = Path("supabase/migrations")
          cert = Path(
              "backend/fresh_install/certification/"
              "supabase/migrations"
          )

          for name in required:
              real_file = real / name
              cert_file = cert / name

              if not real_file.exists():
                  raise SystemExit(
                      f"Missing canonical Supabase migration: {name}"
                  )

              if not cert_file.exists():
                  raise SystemExit(
                      f"Missing certified source migration: {name}"
                  )

              if real_file.read_bytes() != cert_file.read_bytes():
                  raise SystemExit(
                      f"Canonical migration differs from certified copy: "
                      f"{name}"
                  )

          # Migration 4 is frozen and independently certified.
          hotfix = (
              real /
              "20260907125625_"
              "v600_transaction_correctness_hotfix.sql"
          )

          hotfix_hash = hashlib.sha256(
              hotfix.read_bytes()
          ).hexdigest()

          expected_hotfix_hash = (
              "9f1af7ca000acb33f90a3c2c80498737"
              "e6b4296b5415adce0439585ce9f79797"
          )

          if hotfix_hash != expected_hotfix_hash:
              raise SystemExit(
                  "Certified transaction hotfix hash changed."
              )

          # From this baseline onward, runnable Supabase migrations
          # must use 14-digit timestamp migration names.
          bad_names = [
              p.name
              for p in real.glob("*.sql")
              if not re.fullmatch(
                  r"\d{14}_.+\.sql",
                  p.name,
              )
          ]

          if bad_names:
              raise SystemExit(
                  "Invalid runnable Supabase migration names: "
                  + ", ".join(sorted(bad_names))
              )

                    # Historical upgrade/reconstruction migrations must never
          # return to the runnable Supabase migration directory.
          baseline_version = "20260907110044"

          prebaseline = [
              p.name
              for p in real.glob("*.sql")
              if (
                  re.fullmatch(
                      r"\d{14}_.+\.sql",
                      p.name,
                  )
                  and p.name[:14] < baseline_version
              )
          ]

          if prebaseline:
              raise SystemExit(
                  "Historical pre-baseline migrations must not be runnable: "
                  + ", ".join(sorted(prebaseline))
              )
          # Never allow the production project ref inside executable
          # certification/reset scripts.
          production_ref = "yguzrxcdvyimjrfvtcvp"

          cert_root = Path(
              "backend/fresh_install/certification"
          )

          for path in cert_root.rglob("*"):
              if (
                  path.is_file()
                  and path.suffix.lower()
                  in {".ps1", ".py", ".sh"}
              ):
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )

                  if production_ref in text:
                      raise SystemExit(
                          f"Production project ref found in "
                          f"certification script: {path}"
                      )

          safe_reset = (
              cert_root /
              "THQ_SAFE_TEST_RESET.ps1"
          )

          safe_text = safe_reset.read_text(
              encoding="utf-8",
          )

          if "krejepenqgcmnsugbpmv" not in safe_text:
              raise SystemExit(
                  "Safe reset script does not pin the TEST project."
              )

          print(
              "Certified THQ Supabase fresh-install chain: GREEN"
          )
          PY

      - name: Guard release contract & backend compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          contract_file = Path("packages/erp_core/lib/src/release_contract.dart")
          if not contract_file.exists():
            raise SystemExit("Missing release_contract.dart")

          text = contract_file.read_text(encoding="utf-8")
          if not re.search(r"minimumMigration\s*=\s*213", text):
            raise SystemExit("Violation: minimumMigration must be 213")

          if not re.search(r"apiVersion\s*=\s*'v1'", text):
            raise SystemExit("Violation: apiVersion must be 'v1'")

          print("Release contract & backend compatibility: VERIFIED")
          PY

      - name: Guard against committed code-signing private keys
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          forbidden_exts = {".pfx", ".p12", ".key", ".keystore"}
          root = Path(".")
          found = []

          for path in root.rglob("*"):
            if path.is_file() and path.suffix.lower() in forbidden_exts:
              # Exclude git or local scratch test files if any
              if ".git" not in path.parts:
                found.append(str(path))

          if found:
            raise SystemExit(f"ERROR: Committed private keys/certificates found: {found}")

          print("Security check: No private keys committed.")
          PY

      - name: Guard against hardcoded service_role secrets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scanned_dirs = ["apps", "packages"]
          violations = []

          for d in scanned_dirs:
            for path in Path(d).rglob("*.dart"):
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "service_role" in text:
                violations.append(f"{path}: contains service_role secret reference")

          if violations:
            raise SystemExit("Security violation in client code:\n" + "\n".join(violations))

          print("Security check: No service_role secrets in client applications.")
          PY

