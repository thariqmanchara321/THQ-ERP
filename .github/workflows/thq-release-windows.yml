name: THQ ERP Windows Release Delivery

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Target Application'
        required: true
        type: choice
        default: 'client'
        options:
          - 'client'
          - 'pos'
          - 'both'
      bump_type:
        description: 'Version Bump Type'
        required: true
        type: choice
        default: 'auto_build'
        options:
          - 'auto_build'
          - 'patch'
          - 'minor'
          - 'major'
      channel:
        description: 'Release Channel'
        required: true
        type: choice
        default: 'internal_test'
        options:
          - 'internal_test'
          - 'pilot'
      target_device:
        description: 'Target Device (strictly restricted to test PC CLIENT-BC8AEE)'
        required: false
        type: string
        default: 'CLIENT-BC8AEE'
      release_notes:
        description: 'Release Notes (optional, auto-generated if empty)'
        required: false
        type: string
        default: ''
      runner:
        description: 'Target Runner'
        required: true
        type: choice
        default: 'windows-latest'
        options:
          - 'windows-latest'
          - 'self-hosted'

permissions:
  contents: write

# Prevent parallel releases from assigning duplicate build numbers
concurrency:
  group: thq-windows-release-lock
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: ${{ github.event.inputs.runner || 'windows-latest' }}
    environment: release-publishing

    steps:
      - name: Verify Test Device Isolation & Safety Policy
        shell: powershell
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_TARGET_DEVICE: ${{ github.event.inputs.target_device }}
        run: |
          $channel = $env:INPUT_CHANNEL
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "internal_test" }
          $targetDevice = $env:INPUT_TARGET_DEVICE
          if ([string]::IsNullOrWhiteSpace($targetDevice)) { $targetDevice = "CLIENT-BC8AEE" }

          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "THQ ERP RELEASE ISOLATION POLICY CHECK" -ForegroundColor Cyan
          Write-Host "Channel: $channel"
          Write-Host "Target Device: $targetDevice"
          Write-Host "==========================================" -ForegroundColor Cyan

          $allowedDevices = @("CLIENT-BC8AEE", "BC8AEEC1-9BCE-4935-B349-168CAF9A7FA4")
          if ($targetDevice.Trim().ToUpper() -notin $allowedDevices) {
            throw "SECURITY POLICY ERROR: Automated releases are strictly restricted to internal test device 'CLIENT-BC8AEE'. Unauthorized target device: '$targetDevice'"
          }

          if ($channel.Trim().ToLower() -eq "production") {
            throw "SECURITY POLICY ERROR: Automated releases cannot be published directly to production channel. You must test on CLIENT-BC8AEE and promote manually in the Admin Release Management panel."
          }

          Write-Host "Release safety policy passed: Restricted to test device CLIENT-BC8AEE." -ForegroundColor Green

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup 7 (if on hosted runner)
        shell: powershell
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            Write-Host "Installing Inno Setup via Chocolatey..." -ForegroundColor Cyan
            choco install innosetup -y --no-progress
            $innoPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (Test-Path $innoPath) {
              Write-Host "Adding $innoPath to GITHUB_PATH"
              Add-Content $env:GITHUB_PATH "$innoPath"
            }
            $inno7Path = "$env:ProgramFiles\Inno Setup 7"
            if (Test-Path $inno7Path) {
              Write-Host "Adding $inno7Path to GITHUB_PATH"
              Add-Content $env:GITHUB_PATH "$inno7Path"
            }
          } else {
            Write-Host "Inno Setup already installed: $($iscc.Source)"
          }

      - name: Verify Windows Build Environment
        shell: powershell
        run: |
          Write-Host "Checking Windows development environment..."
          flutter doctor -v

      - name: Resolve Flutter Dependencies
        shell: powershell
        run: |
          $app = "${{ github.event.inputs.app }}"
          if ([string]::IsNullOrWhiteSpace($app)) { $app = "client" }
          Write-Host "Resolving core dependencies..."
          Push-Location packages/erp_core; flutter pub get; Pop-Location
          Push-Location packages/thq_ui; flutter pub get; Pop-Location
          if ($app -eq "pos" -or $app -eq "both") {
            Push-Location apps/pos_app; flutter pub get; Pop-Location
          }
          if ($app -eq "client" -or $app -eq "both") {
            Push-Location apps/client_app; flutter pub get; Pop-Location
          }

      - name: Centralized Version & Build Allocation
        id: versioning
        shell: powershell
        run: |
          $app = "${{ github.event.inputs.app }}"
          if ([string]::IsNullOrWhiteSpace($app)) { $app = "client" }
          $bump = "${{ github.event.inputs.bump_type }}"
          if ([string]::IsNullOrWhiteSpace($bump)) { $bump = "auto_build" }

          Write-Host "Allocating atomic version/build for App: $app, Bump: $bump"
          python tools/release/manage_version.py --app $app --bump-type $bump

      - name: Run Application Tests
        shell: powershell
        run: |
          $app = "${{ github.event.inputs.app }}"
          if ([string]::IsNullOrWhiteSpace($app)) { $app = "client" }
          Push-Location packages/erp_core; flutter test; Pop-Location
          if ($app -eq "pos" -or $app -eq "both") {
            Push-Location apps/pos_app; flutter test; Pop-Location
          }
          if ($app -eq "client" -or $app -eq "both") {
            Push-Location apps/client_app; flutter test; Pop-Location
          }

      - name: Compile Windows Release & Inno Setup
        id: build_release
        shell: powershell
        run: |
          $app = "${{ github.event.inputs.app }}"
          if ([string]::IsNullOrWhiteSpace($app)) { $app = "client" }
          
          Write-Host "Building Windows Release and Installer for $app..." -ForegroundColor Cyan
          powershell -ExecutionPolicy Bypass -File tools/windows_release/BUILD_THQ_WINDOWS_RELEASE.ps1 `
            -ProjectRoot $env:GITHUB_WORKSPACE `
            -TargetApp $app `
            -Format installer `
            -SkipVcRedist

      - name: Code Signing (Authenticode)
        id: signing
        shell: powershell
        env:
          CERT_BASE64: ${{ secrets.THQ_WINDOWS_SIGN_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.THQ_WINDOWS_SIGN_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.THQ_WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "Authenticode certificate provided. Signing installer..." -ForegroundColor Green
            $certPath = Join-Path $env:TEMP "thq_release_sign.pfx"
            $importedCerts = $null
            try {
              [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CERT_BASE64))
              
              # Import into runner CurrentUser Root store for Authenticode chain validation
              try {
                $secPassword = ConvertTo-SecureString -String $env:CERT_PASSWORD.Trim() -Force -AsPlainText
                $importedCerts = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\Root" -Password $secPassword
              } catch {
                Write-Host "Notice: Direct root store import skipped: $_"
              }

              $installers = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build\windows_release" -Filter "*.exe" -Recurse
              if (-not $installers -or $installers.Count -eq 0) {
                throw "No installer executable found under build\windows_release to sign."
              }
              foreach ($inst in $installers) {
                Write-Host "Signing $($inst.FullName)..."
                powershell -ExecutionPolicy Bypass -File tools/windows_release/SIGN_WINDOWS_FILE.ps1 `
                  -FilePath $inst.FullName `
                  -CertificatePath $certPath `
                  -Password $env:CERT_PASSWORD `
                  -TimestampUrl $env:TIMESTAMP_URL
                
                $sig = Get-AuthenticodeSignature -FilePath $inst.FullName
                Write-Host "Signature Status: $($sig.Status) | Signer: $($sig.SignerCertificate.Subject)"
                if ($sig.Status -ne "Valid") {
                  throw "Fail-Closed: Authenticode signature verification failed for $($inst.Name): Status is $($sig.Status) (expected Valid). Error: $($sig.StatusMessage)"
                }
              }
            } finally {
              if ($importedCerts) {
                foreach ($c in $importedCerts) {
                  $c | Remove-Item -Force -ErrorAction SilentlyContinue
                }
              }
              if (Test-Path $certPath) {
                Remove-Item -Force $certPath
                Write-Host "Cleaned up temporary signing certificate."
              }
            }
          } else {
            throw "FAIL-CLOSED POLICY: Code signing certificate secret 'THQ_WINDOWS_SIGN_PFX_BASE64' is missing in release-publishing environment. An Authenticode signature (Status = Valid) is mandatory for THQ Business updates. Release publication halted."
          }

      - name: Publish to Supabase Private Storage & Registry
        id: publish
        shell: powershell
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://yguzrxcdvyimjrfvtcvp.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_TARGET_DEVICE: ${{ github.event.inputs.target_device }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          $channel = $env:INPUT_CHANNEL
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "internal_test" }
          
          # Default to internal test PC to guarantee test device isolation
          $targetDevice = $env:INPUT_TARGET_DEVICE
          if ([string]::IsNullOrWhiteSpace($targetDevice)) { $targetDevice = "CLIENT-BC8AEE" }
          
          $manifest = "$env:GITHUB_WORKSPACE\build\windows_release\release_manifest.json"
          if (-not (Test-Path $manifest)) {
            throw "release_manifest.json not found at $manifest"
          }

          # Safely write release notes to a temporary file to prevent PowerShell execution or injection
          $notesFile = Join-Path $env:TEMP "thq_release_notes_$([System.Guid]::NewGuid().ToString('N')).txt"
          try {
            [System.IO.File]::WriteAllText($notesFile, [string]$env:INPUT_RELEASE_NOTES, [System.Text.Encoding]::UTF8)

            $publishArgs = @(
              "tools/release/publish_release.py",
              "--manifest", $manifest,
              "--channel", $channel,
              "--target-device", $targetDevice,
              "--release-notes-file", $notesFile
            )

            Write-Host "Executing publish_release.py with isolated arguments..."
            python @publishArgs
          } finally {
            if (Test-Path $notesFile) {
              Remove-Item -Force $notesFile -ErrorAction SilentlyContinue
            }
          }

      - name: Retain Immutable Artifacts & Provenance
        uses: actions/upload-artifact@v4
        with:
          name: thq-windows-release-${{ github.sha }}
          path: |
            build/windows_release/*.exe
            build/windows_release/release_manifest.json
          retention-days: 90

      - name: Tag Release in Git (Safe, Non-Overwriting)
        shell: powershell
        run: |
          try {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            $v = "${{ steps.versioning.outputs.version }}"
            $b = "${{ steps.versioning.outputs.build_number }}"
            if (-not [string]::IsNullOrWhiteSpace($v) -and -not [string]::IsNullOrWhiteSpace($b)) {
              $tagName = "v$v+$b"
              Write-Host "Checking if Git tag '$tagName' already exists..."
              
              # Strictly check if tag already exists in local or remote to prevent overwriting
              $localTag = git tag -l $tagName
              if (-not [string]::IsNullOrWhiteSpace($localTag)) {
                Write-Warning "Tag '$tagName' already exists locally. Skipping tagging to prevent tag overwriting."
                return
              }
              $remoteTag = git ls-remote --tags origin "refs/tags/$tagName"
              if (-not [string]::IsNullOrWhiteSpace($remoteTag)) {
                Write-Warning "Tag '$tagName' already exists on remote origin. Skipping tagging to prevent tag overwriting."
                return
              }

              git add apps/*/pubspec.yaml tools/windows_release/*.iss packages/erp_core/lib/src/release_contract.dart
              $status = git status --porcelain
              if (-not [string]::IsNullOrWhiteSpace($status)) {
                git commit -m "chore(release): bump version to $v+$b [skip ci]"
              }

              # Create immutable tag cleanly without force (-f) flag
              git tag $tagName
              git push origin "refs/tags/$tagName"
              Write-Host "Successfully published immutable release tag '$tagName' to origin." -ForegroundColor Green
            }
          } catch {
            Write-Warning "Git tagging completed with advisory notice: $_. Release is recorded in Supabase."
          }
