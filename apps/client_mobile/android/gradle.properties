org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Build subprojects sequentially on Windows to avoid native-plugin cache races.
org.gradle.parallel=false
org.gradle.workers.max=2
# THQ Windows stability: Gradle cache is kept, but Kotlin incremental compilation is disabled below because Pub cache and project may be on different drive roots.
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
